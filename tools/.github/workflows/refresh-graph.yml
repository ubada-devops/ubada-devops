Set-Content -Path .github\workflows\refresh-graph.yml -Value @"
name: Refresh contribution graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: pip install -r tools/requirements-daily.txt
        
      - name: Fetch updated contributions
        run: python tools/pull_contributions.py
        
      - name: Render new SVG
        run: python tools/render_graph.py
        
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: refresh contribution graph [skip ci]"
          file_pattern: "assets/contributions.json graph.svg"
"@